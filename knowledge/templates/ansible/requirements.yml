# Copy to <project>/ansible/requirements.yml
#
# Install with:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-galaxy role install -r requirements.yml
#
# Pin every collection. An unpinned collection means a module's behaviour can change
# between two runs of the same playbook -- the opposite of what configuration
# management is for.
#
# CONTROL-NODE FLOOR: ansible-core >= 2.17 is a HOUSE choice. Every range pinned below declares
# only `requires_ansible: >=2.15.0` -- amazon.aws first requires 2.17 at 10.0.0, which the <10
# ceiling excludes. Keep the floor identical locally AND in CI anyway: if CI resolves a newer
# core it passes, and the same playbook then fails on a laptop pinned lower.
---
collections:
  # AWS modules + the aws_ec2 dynamic inventory plugin + the aws_ssm connection plugin.
  # Needs boto3/botocore on the control node.
  - name: amazon.aws
    version: '>=9.0.0,<10.0.0'

  # Broad grab-bag: pids, timezone, ini_file, pam_limits, and sefcontext (the persistent
  # SELinux labeling module -- file's setype: alone does not survive a relabel).
  - name: community.general
    version: '>=10.0.0,<11.0.0'

  # POSIX-specific: firewalld, seboolean, sysctl, mount, authorized_key, synchronize,
  # plus the profile_tasks callback. Required for the RedHat-family firewall/SELinux path.
  - name: ansible.posix
    version: '>=2.0.0,<3.0.0'

  # Container management + the docker connection driver used by molecule.
  - name: community.docker
    version: '>=4.0.0,<5.0.0'

  # Uncomment when the project actually needs them -- do not install speculatively.
  # - name: community.postgresql
  #   version: '>=4.0.0,<5.0.0'
  # - name: ansible.utils          # ipaddr/ipmath filters
  #   version: '>=5.0.0,<6.0.0'
  # - name: community.crypto       # openssl_certificate, x509 helpers
  #   version: '>=2.20.0,<3.0.0'

# Prefer writing a small role over pulling a large community one. If you do pull one, pin the
# version and read its tasks -- it runs with your privileges.
# Comment out the KEY together with its items: `roles: []` followed by an indented `- name:`
# is a YAML error.
roles: []
