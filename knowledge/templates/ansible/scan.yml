# Copy to <project>/.github/workflows/ansible-scan.yml
#
# Mirrors the two-tier doctrine already used by iac-scan.yml: advisory reporters plus one
# blocking gate. The local verify ladder is not enough on its own -- CI is the
# defense-in-depth copy that cannot be skipped.
#
#   yamllint            -> advisory (style; reported, never blocks)
#   --syntax-check      -> blocking (a syntax error means nothing works)
#   ansible-lint        -> blocking, production profile (the real gate)
#
# Deliberately absent: any job that RUNS a playbook against a host. CI lints; humans apply.
---
name: Ansible Scan

# No `paths:` filter -- this job is meant to be a REQUIRED status check. A workflow
# skipped by a paths filter reports no status at all, and GitHub cannot tell "skipped"
# from "not started", so the PR blocks on `Expected - Waiting for status to be
# reported` with nothing to fix. The filter is evaluated against the PR's whole
# base...head diff, so a PR that adds a file and removes it again locks itself out.
# Reinstating filters here means dropping this job from Required checks in the same change.
'on':
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# CI is safe to cancel when new commits arrive.
concurrency:
  group: ansible-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-scan:
    name: yamllint / syntax-check / ansible-lint
    runs-on: ubuntu-latest
    # ANSIBLE_DIR is the ONLY place to change the layout: the "Locate" step below resolves it
    # once and every later step uses steps.loc.outputs.dir, so nothing is hardcoded.
    #
    # It has to be a real `cd` (working-directory), not ANSIBLE_CONFIG=ansible/ansible.cfg:
    # that env var loads the file, but the relative paths INSIDE it (inventory, roles_path)
    # still resolve against the caller's cwd, so from the repo root you get the config without
    # its inventory. Same reason verify.sh cd's into the target.
    env:
      ANSIBLE_DIR: ansible
      PLAYBOOK: site.yml

    steps:
      - uses: actions/checkout@v4

      # NO `cache: pip`. setup-python defaults its cache key to **/requirements.txt with a single
      # backup of **/pyproject.toml, and HARD-FAILS ("No file in ... matched to ...") when neither
      # exists. An Ansible repo has ansible/requirements.yml — a Galaxy file, not a pip file — so
      # the cache would fail the job before a single lint ran, on a gate that is meant to be
      # Required in branch protection. Three pinned wheels do not need a cache.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The triggers above also fire on ROOT-level roles/, playbooks/, group_vars/ — a layout
      # rules/ansible.md supports and /ansible-implement is told to match. A literal
      # `working-directory: ansible` would make every step below error out ("no such
      # directory") on those repos, including the blocking ones. Resolve the path instead.
      - name: Locate the Ansible tree
        id: loc
        run: |
          if [ -d "$ANSIBLE_DIR" ]; then
            echo "dir=$ANSIBLE_DIR" >> "$GITHUB_OUTPUT"
          elif [ -d roles ] || [ -d playbooks ] || [ -f "$PLAYBOOK" ]; then
            echo "::notice::no $ANSIBLE_DIR/ — using the repo root"
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::no Ansible tree found (looked for $ANSIBLE_DIR/, roles/, playbooks/, $PLAYBOOK)"
            exit 1
          fi

      - name: Install the toolchain
        run: |
          python -m pip install --upgrade pip
          # Pin the majors so a new upstream release cannot turn a green PR red overnight.
          # The 2.17 floor is a real requirement: amazon.aws >=11 and community.docker >=5
          # both declare requires_ansible >=2.17.0. These three ranges must stay identical to
          # bootstrap-ansible.sh's PY_PKGS -- whichever side resolves a different major first
          # is where "green pipeline, red laptop" comes from.
          pip install 'ansible-core>=2.17,<2.22' 'ansible-lint>=25.0,<27.0' 'yamllint>=1.35,<2.0'

      - name: Install pinned collections
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          # NOT a skip. rules/ansible.md requires every collection to be declared here, and
          # without them ansible-lint/--syntax-check cannot resolve FQCNs like
          # amazon.aws.ec2_instance — the gates would "pass" by never seeing the modules.
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml
          else
            echo "::error::no requirements.yml — every collection must be declared and pinned"
            echo "  copy knowledge/templates/ansible/requirements.yml, or set ANSIBLE_DIR correctly"
            exit 1
          fi

      # 1) Style. Reported for visibility but never blocks: indentation and line length
      #    are not correctness, and a noisy gate gets ignored.
      #    continue-on-error alone is the non-blocking mechanism -- no trailing `|| true`,
      #    which would also swallow yamllint crashing outright.
      - name: yamllint (advisory)
        continue-on-error: true
        working-directory: ${{ steps.loc.outputs.dir }}
        run: yamllint -f github .

      # 2) Syntax. Blocking -- catches unknown modules, bad parameters, missing includes.
      - name: ansible-playbook --syntax-check
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          # NOT a skip: a blocking gate that silently does nothing is the failure mode this
          # whole workflow exists to prevent. No playbook means nothing to syntax-check, which
          # is a defect in the target or a wrong PLAYBOOK value -- either way, stop and say so.
          if [ -f "${PLAYBOOK}" ]; then
            ansible-playbook "${PLAYBOOK}" --syntax-check
          else
            echo "::error::${PLAYBOOK} not found under ${{ steps.loc.outputs.dir }}"
            echo "  set the PLAYBOOK env var at the top of this workflow to the real entrypoint"
            exit 1
          fi

      # 3) The real gate. production profile: FQCN, named tasks, changed_when on commands,
      #    risky file permissions, no_log on secrets.
      - name: ansible-lint (production profile — blocking)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: ansible-lint --profile production --nocolor .

      # 4) Cheap structural guardrails that linting does not cover. Blocking, because each
      #    of these is a Critical finding in the review checklist.
      - name: Targeting-safety checks
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          fail=0
          # Must also catch the inline play form "- hosts: all", quoted "all", and a
          # trailing comment. '-' is not whitespace, so ^\s*hosts: misses the common case.
          if grep -rnE --include='*.yml' --include='*.yaml' \
               "^[[:space:]]*-?[[:space:]]*hosts:[[:space:]]*['\"]?all['\"]?[[:space:]]*(#.*)?$" .; then
            echo "::error::'hosts: all' found — target a specific group"; fail=1
          fi
          # Three ways this gets disabled, and the naive grep only catches the first:
          #   host_key_checking = False           <- explicit
          #   host_key_checking = True # keep on  <- '#' is NOT an inline comment prefix in
          #                                          ansible.cfg, so the value is the literal
          #                                          string and boolean(strict=False) -> False
          #   ANSIBLE_HOST_KEY_CHECKING=False     <- env form, and -i makes case vary
          # ANCHOR every pattern at line start. Unanchored, the '#'-trap check matched a COMMENT
          # explaining the trap — turning the gate red on a config that does the right thing.
          if grep -rniE '^[[:space:]]*host_key_checking[[:space:]]*=[[:space:]]*(False|no|0)([[:space:]]|$)' . \
             || grep -rniE '^[[:space:]]*host_key_checking[[:space:]]*=[[:space:]]*[^;#]*#' . \
             || grep -rniE '^[[:space:]]*ANSIBLE_HOST_KEY_CHECKING[[:space:]]*=[[:space:]]*(False|no|0)' .; then
            echo "::error::host_key_checking is disabled, or carries a '#' comment that silently makes it False"; fail=1
          fi
          # The blind spot behind the line above: ssh_args is connection-PLUGIN config, so
          # `ansible-config dump --only-changed` never shows it and HOST_KEY_CHECKING can read True
          # while StrictHostKeyChecking is off. Verified on ansible-core 2.21.
          if grep -rniE '^[[:space:]]*ssh_args.*StrictHostKeyChecking[[:space:]]*=[[:space:]]*no' . \
             || grep -rniE '^[[:space:]]*ssh_args.*UserKnownHostsFile[[:space:]]*=[[:space:]]*/dev/null' .; then
            echo "::error::ssh_args disables host verification — this defeats host_key_checking silently"; fail=1
          fi
          # grep cannot see through hosts: "{{ var }}" — flag it for human review.
          if grep -rnE --include='*.yml' '^[[:space:]]*-?[[:space:]]*hosts:[[:space:]]*["'"'"']?\{\{' .; then
            echo "::warning::templated 'hosts:' — blast radius cannot be verified statically"
          fi
          exit $fail
