; Copy to <project>/ansible/ansible.cfg
; Config precedence (low -> high): /etc/ansible/ansible.cfg -> ~/.ansible.cfg -> ./ansible.cfg -> $ANSIBLE_CONFIG
; Keeping it per-project (./ansible.cfg) means the config travels with the playbooks.

[defaults]
inventory = inventory.ini
roles_path = roles

; NO collections_path here. Setting it REPLACES the default search list
; (~/.ansible/collections:/usr/share/ansible/collections) rather than extending it, so a
; collection installed the normal way (`ansible-galaxy collection install`, which writes to
; ~/.ansible/collections) stops being found and --syntax-check dies with
; "couldn't resolve module/action 'ansible.posix.firewalld'".
; If you deliberately want project-vendored collections, install them there explicitly
; (`ansible-galaxy collection install -r requirements.yml -p ./collections`) and set
; ANSIBLE_COLLECTIONS_PATH for that command only.

; SECURITY: keep host key checking ON. A prior infrastructure review flagged this being
; disabled as a Medium finding. Disable it only for throwaway test containers, via env var
; on that single command -- never in a committed config.
host_key_checking = True

; Pin the PLATFORM python, do not let discovery choose. auto_silent prefers newer interpreters,
; so on Rocky 9 it selects /usr/bin/python3.12 -- which exists but carries none of the distro's
; bindings. Every module that needs them then fails with "Failed to import the required Python
; library": sefcontext, seboolean, firewalld, dnf. The distro ships bindings only for the platform
; interpreter, and /usr/bin/python3 points at it on every generation (3.9 on Rocky 9, 3.12 on
; Rocky 10, 3.12 on Ubuntu 24.04). One value, no fact branching, correct across the fleet.
interpreter_python = /usr/bin/python3

forks = 10
timeout = 30

; Readable YAML output + per-task timings (finds the slow task fast).
; NOTE: use core's own callback with result_format -- the community.general 'yaml' callback is
; deprecated and scheduled for removal, and would break this file when it goes.
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
; The tempting reason to hide skips is noise, and the noise is real: measured on a 9-role
; baseline, True prints 135 "skipping:" lines against 419 tasks. A third of the output as
; OS-branch chatter trains people not to read it, which is its own failure mode.
;
; But the reason NOT to hide them is also real. `--check --diff` is the human approval gate, and
; check mode skips exactly the tasks that protect you: every `command` (so every live probe) and
; anything gated on `not ansible_check_mode` (so a whole verification role). With this False the
; reviewer sees a clean preview with no hint that the safety gates never ran -- and "the preview
; was green" then means something weaker than they think.
;
; Neither setting resolves that, so do not try to resolve it here. Keep the output quiet AND make
; each GATE announce its own absence: an explicit `debug` in check mode saying NOT VERIFIED /
; NOT PREVIEWED, on the one host, at the one moment it matters. Signal without the noise.
display_skipped_hosts = False

; .retry files are noise in a git repo.
retry_files_enabled = False
nocows = True

; Uncomment to log runs. WARNING: log output can contain sensitive data --
; gitignore the file and rely on no_log: true to keep secrets out in the first place.
; log_path = ./ansible.log

[privilege_escalation]
; Escalate per task rather than globally -- least privilege.
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
; ControlPersist MUST dominate the longest gap between two commands sent to a host -- and the
; longest such gap is usually a `delegate_to: localhost` retry loop that probes the host's SSH
; while sending it nothing. Do the arithmetic before trusting the default:
;
;   attempts        = 1 + retries       <- ansible/executor/task_executor.py:519-521, NOT `retries`
;   worst case      = attempts * ConnectTimeout + retries * delay
;   retries: 6, ConnectTimeout 10, delay 5  ->  7*10 + 6*5 = 100s
;
; With ControlPersist=60s the multiplexed master is torn down at 60s, so the rescue that runs
; after the probe fails must open a NEW connection -- to the host that has just stopped
; accepting new connections. The rollback then fails too, and the design's core assumption
; ("the already-open session survives and executes the rollback") is quietly false.
;
; It passes in testing because the common failure returns `Connection refused` instantly and the
; loop finishes in ~30s. The path that blows the budget is packets DROPPED rather than refused --
; a wrong ListenAddress, MaxStartups exhaustion, a hung PAM stack, a firewall change -- which is
; exactly the case the guard exists for. 600s costs nothing but an idle local socket.
;
; Pipelining is a large speedup; it requires 'requiretty' to be off in sudoers on targets.
pipelining = True
; IdentitiesOnly=yes is NOT optional on a workstation. Without it SSH offers every key in
; ssh-agent (and every default IdentityFile) BEFORE the one you named in
; ansible_ssh_private_key_file. sshd's MaxAuthTries is 6, so an agent holding 6+ keys makes the
; server disconnect with "Too many authentication failures" -- on a host whose key you hold.
; The symptom reads as a broken host or a wrong key; it is neither.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o PreferredAuthentications=publickey -o IdentitiesOnly=yes
; Keep control sockets out of the repo.
control_path_dir = ~/.ansible/cp
