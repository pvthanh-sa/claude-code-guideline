# Terraform IaC security gate (CI — defense-in-depth Layer 3).
# Copy to .github/workflows/iac-scan.yml. Mirrors the local gate run at /iac-implement (G3) so
# nothing merges unscanned even if the local flow is skipped. Runs on PRs/pushes touching Terraform:
#   fmt → validate → tflint → Checkov (report) → Trivy config (blocking on HIGH/CRITICAL).
# Findings surface in PR checks and the repo Security tab (SARIF).
name: IaC Scan

# NO `paths:` filter, deliberately — this gate is meant to be a REQUIRED status check.
# A workflow skipped by a path filter reports no status at all, and GitHub cannot tell
# "skipped" apart from "not started", so a required check that can be skipped blocks any
# PR outside those paths forever: nothing failed, nothing to re-run, nothing to fix. The
# filter is also evaluated over the PR's whole base...head diff, so a PR that adds a file
# and removes it again locks itself out.
#
# The trade is ~2-4 min of runner time on PRs that touch no Terraform. Take it: one
# deadlocked PR costs more than a year of that. It also closes a real gap — the scanners
# read the whole tree, not the diff, so a finding arriving via a merge into a stale branch
# is only caught by a run that was not filtered away.
#
# Adding a filter back (large monorepo, minutes actually scarce): do NOT filter the
# trigger. Keep it unfiltered so the job always reports, and gate the expensive STEPS on a
# change-detection step (e.g. `dorny/paths-filter`, SHA-pinned) — the check still reports
# success on every PR, it just does no work when nothing relevant changed.
#
# If you keep this unfiltered on a repo that may contain ZERO .tf files, first confirm
# fmt/tflint/checkov/trivy all exit 0 on an empty tree — only `terraform validate` guards
# that case here.
on:
  pull_request:
  push:
    branches: [main, master]   # both: a repo created before GitHub's default flipped still uses master

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab
  actions: read            # upload-sarif calls get-a-workflow-run, which needs this in PRIVATE
                           # repos ("only required for workflows in private repositories" — GitHub
                           # docs). Declaring a permissions block sets every UNDECLARED scope to
                           # none, so omitting it fails the step with the misleading
                           # "Resource not accessible by integration" rather than a permission name.

concurrency:                 # CI is safe to cancel when new commits arrive
  group: iac-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac-scan:
    name: fmt / validate / lint / misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # 1) Format — fail if any .tf isn't canonically formatted.
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # 2) Validate ROOT configs only — dirs with a provider/backend block (no state access needed).
      #    Child modules under modules/ are validated transitively by the roots that call them;
      #    validating a module as a standalone root throws false errors (e.g. "output refers to
      #    sensitive values", or missing provider configuration_aliases).
      - name: terraform validate (roots)
        run: |
          set -e
          roots=$(grep -rlE '^[[:space:]]*(provider[[:space:]]+"|backend[[:space:]]+")' --include='*.tf' . \
                  | grep -v '/\.terraform/' | xargs -r -n1 dirname | sort -u)
          [ -z "$roots" ] && { echo "no root configs found — skipping validate"; exit 0; }
          for d in $roots; do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      # 3) Lint (loads .tflint.hcl plugins if present). Warnings are printed but only ERRORS block
      #    the gate — `terraform_unused_declarations` etc. are too noisy to fail a build on.
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: |
          tflint --init || true
          tflint --recursive --format compact --minimum-failure-severity=error

      # 4) Misconfig scanner #1 — Checkov (policy-as-code, 1000+ rules).
      #    Runs in REPORT mode (Checkov CE has no severity threshold, so blocking on every rule
      #    is too noisy). To make it blocking, drop --soft-fail (and curate a .checkov.yaml
      #    skip-list).
      - name: Checkov
        run: |
          set -o pipefail
          pip install --quiet checkov
          checkov -d . --framework terraform --quiet --compact \
            -o cli -o sarif --output-file-path console,checkov.sarif --soft-fail \
            | tee checkov-cli.txt

      # 4b) Surface Checkov on the run page. A report-only scanner needs somewhere people actually
      #     look: on a PRIVATE repo the Security tab is unavailable (step 6), so without this the
      #     findings live only in a collapsed job log and nobody ever reads them. The step summary
      #     renders on the run itself, so a rising failed-check count is visible at a glance.
      - name: Checkov summary
        if: always()
        run: |
          {
            echo '### Checkov (report-only — does not block)'
            echo
            if [ -s checkov-cli.txt ]; then
              echo '```'
              grep -E '^(Passed checks|Failed checks|Skipped checks|Check: )' checkov-cli.txt | head -60 || true
              echo '```'
              echo
              echo "<details><summary>Full Checkov output</summary>"
              echo
              echo '```'
              tail -c 60000 checkov-cli.txt
              echo '```'
              echo '</details>'
            else
              echo '_No Checkov output captured._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 5) Misconfig scanner #2 — Trivy config (tfsec successor). THIS is the blocking gate:
      #    fails the run on HIGH/CRITICAL misconfig. Different ruleset than Checkov → wider coverage.
      - name: Trivy config
        uses: aquasecurity/trivy-action@v0.36.0   # tags are v-prefixed; bump from github.com/aquasecurity/trivy-action/releases
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true   # REQUIRED: else SARIF mode scans ALL severities and
                                              # exit-code fires on MEDIUM/LOW too. This makes `severity`
                                              # apply to the scan, so only HIGH/CRITICAL block.
          exit-code: '1'                      # (.trivyignore at repo root is read automatically)

      # 6) Publish both reports to the Security tab (even when a scan failed).
      #    Gated on repo visibility: code scanning on a PRIVATE repo requires GitHub Code Security /
      #    Advanced Security, so on a private repo without it the upload can only fail. A step that
      #    fails on every single run is worse than no step — people stop reading the colour, and the
      #    one run that fails for a real reason goes unnoticed. Skipping states the precondition in
      #    code and needs no edit later: make the repo public, or enable Code Security, and these
      #    resume on the next run. Findings are not lost meanwhile — Checkov is in the step summary
      #    (4b) and Trivy still fails the job on HIGH/CRITICAL.
      - name: Upload Checkov SARIF
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov
      - name: Upload Trivy SARIF
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-config
