# NotebookLM sync list for the {{SUBJECT}} study track (examples/{{SUBJECT_ID}}-study-guide.md).
# Save as examples/{{SUBJECT_ID}}-sync.conf, then run:
#   ~/.claude/skills/dual-engine-study/scripts/sync-notebooklm.sh {{SUBJECT_ID}}
#
# Add, rename or remove a source line whenever a doc is added, renamed or deleted.
# Flat names carry their origin (lab-2-…, lab-3-step-05-…), so NotebookLM citations show where a passage comes from.

docs = {{DOCS_DIR}}
# Keep dest inside the docs folder and git-ignore it there.
dest = {{DOCS_DIR}}/notebooklm-{{SUBJECT_ID}}

# source = path relative to docs | flat name in the NotebookLM folder
source = {{theory.md}} | {{subject-theory.md}}
source = {{labs/lab-1-something.md}} | {{lab-1-something.md}}

# .md files under docs that are deliberately not uploaded (path prefixes), e.g. app source code
# skip = {{labs/lab-2/app-source/}}
